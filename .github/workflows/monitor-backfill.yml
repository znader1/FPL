name: Monitor backfill
# Builds the monitoring dashboard's per-gameweek reports (app vs The Scout vs the
# owner vs real points) and writes them to Supabase. Runs every six hours with
# "auto" (the next deadline's gameweek and the six before it, so a live gameweek
# fills in once FPL marks it finished and every points window is re-scored), or by
# hand with an explicit range. Apply supabase/migrations/20261106_monitoring_tables.sql
# before the first run.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      gws:
        description: "Gameweeks to build: auto, 1-10 or 9,10"
        required: true
        default: "auto"
      entries:
        description: "FPL entry ids, comma-separated"
        required: true
        default: "107342,5645321"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build and store the reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # A scheduled run has no inputs: it takes the defaults.
          GWS: ${{ inputs.gws || 'auto' }}
          ENTRIES: ${{ inputs.entries || '107342,5645321' }}
        # Inputs reach the script through the environment, never the shell line.
        run: PYTHONPATH=. python scripts/monitor_backfill.py --gws "$GWS" --entries "$ENTRIES"
