# fly.dev.toml — dev/staging app for feature branch testing
app = 'fpl-assistant-api-dev'
primary_region = 'lhr'

[build]

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'

[[mounts]]
  source = 'fpl_data_dev'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
