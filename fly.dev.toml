# fly.dev.toml — dev/staging app for feature branch testing
app = 'fpl-assistant-api-dev'
primary_region = 'lhr'

[build]

[env]
  PORT = '8000'
  # One worker. The model build is CPU-bound on a single shared vCPU, so a second
  # worker only competes for it — and every cache (projections, match history,
  # minutes history) is per-process, so two workers double the memory on a 512MB
  # machine and halve the cache hit rate.
  WEB_CONCURRENCY = '1'

[[mounts]]
  source = 'fpl_data_dev'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
