# fly.toml app configuration file generated for fpl-assistant-api on 2026-04-26T10:37:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fpl-assistant-api'
primary_region = 'lhr'

[build]

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'

[[mounts]]
  source = 'fpl_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
